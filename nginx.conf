server {
    listen 8080;
    server_name localhost;
    root /path/to/ctf-softec/apps/web/dist;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /index.html {
        proxy_pass http://127.0.0.1:3001/api/v1/entrance/page;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
